name: 每日梗库更新

on:
  schedule:
    # 工作日早间 7:30 (北京时间 = UTC+8 → UTC 23:30 前一天)
    - cron: '30 23 * * 0,1,2,3,4'
    # 工作日晚间 17:30 (北京时间 → UTC 9:30)
    - cron: '30 9 * * 1,2,3,4,5'
    # 周末早间 9:00 (北京时间 → UTC 1:00)
    - cron: '0 1 * * 6,0'
    # 周末晚间 18:00 (北京时间 → UTC 10:00)
    - cron: '0 10 * * 6,0'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成梗内容
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: node scripts/generate.mjs

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/content.json
          if git diff --staged --quiet; then
            echo "没有新内容需要提交"
          else
            git commit -m "chore: 更新梗库内容 $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M CST')"
            git pull --rebase origin main || true
            git push
          fi
