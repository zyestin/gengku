name: AI炸裂内容更新

on:
  schedule:
    # 每天上午 10:00 (北京时间 = UTC+8 → UTC 02:00)
    - cron: '0 2 * * *'
    # 每天下午 15:00 (北京时间 = UTC+8 → UTC 07:00)
    - cron: '0 7 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成AI炸裂内容
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/generate.mjs --mode ai

      - name: Commit & Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ai.json
          git diff --staged --quiet || git commit -m "🤖 AI炸裂内容自动更新 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main || true
          git push
